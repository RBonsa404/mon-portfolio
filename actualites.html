<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualités — BONSA Abdoul Rachid</title>

  <!-- Thème appliqué avant le premier rendu, pour éviter un flash -->
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("portfolio-theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <meta name="description" content="Publications, activités et attestations de BONSA Abdoul Rachid, développeur full-stack et Président du Club Informatique de l'IST.">
  <meta name="author" content="BONSA Abdoul Rachid">
  <meta name="theme-color" content="#0c121c">
  <link rel="canonical" href="https://rbonsa404.github.io/mon-portfolio/actualites.html">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rbonsa404.github.io/mon-portfolio/actualites.html">
  <meta property="og:title" content="Actualités — BONSA Abdoul Rachid">
  <meta property="og:description" content="Publications, activités et attestations.">
  <meta property="og:image" content="https://rbonsa404.github.io/mon-portfolio/assets/img/profile.jpg">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-news">

  <header class="header header--scrolled" id="header">
    <nav class="nav container" aria-label="Navigation principale" data-i18n-aria="aria_nav">
      <a href="index.html" class="nav__logo" aria-label="BONSA Abdoul Rachid">
        <span class="nav__logo-mark">AR</span>
        <span class="nav__logo-text">Bonsa</span>
      </a>

      <div class="nav__tools">
        <a href="index.html" class="tool-btn tool-btn--text tool-btn--link" data-i18n="news_back_home">← Portfolio</a>
        <button class="tool-btn" id="theme-toggle" type="button" aria-label="Basculer le thème">
          <svg class="tool-btn__icon tool-btn__icon--sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg class="tool-btn__icon tool-btn__icon--moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
        <button class="tool-btn tool-btn--text mono" id="lang-toggle" type="button" aria-label="Passer en anglais" data-i18n-aria="aria_lang">
          <span data-i18n="lang_toggle">EN</span>
        </button>
      </div>
    </nav>
  </header>

  <main id="main">
    <section class="news-hero">
      <div class="container">
        <span class="section__index mono" data-i18n="news_kicker">Journal de bord</span>
        <h1 class="news-hero__title" data-i18n="news_title">Actualités</h1>
        <p class="section__intro" data-i18n="news_intro">Mes publications, les activités que je mène et les attestations obtenues en chemin.</p>

        <div class="tabs" role="tablist" aria-label="Actualités">
          <button class="tabs__btn is-active" type="button" role="tab" id="tab-posts" aria-selected="true" aria-controls="panel-posts">
            <span data-i18n="news_tab_posts">Publications</span>
            <span class="tabs__count mono" id="count-posts">0</span>
          </button>
          <button class="tabs__btn" type="button" role="tab" id="tab-certificates" aria-selected="false" aria-controls="panel-certificates">
            <span data-i18n="news_tab_certificates">Attestations</span>
            <span class="tabs__count mono" id="count-certificates">0</span>
          </button>
        </div>
      </div>
    </section>

    <section class="news-body">
      <div class="container">
        <div class="tabs__panel" id="panel-posts" role="tabpanel" aria-labelledby="tab-posts">
          <div class="posts-grid" id="posts-grid"></div>
        </div>
        <div class="tabs__panel" id="panel-certificates" role="tabpanel" aria-labelledby="tab-certificates" hidden>
          <div class="certificates-grid" id="certificates-grid"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Visionneuse d'images -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__close" type="button" id="lightbox-close" aria-label="Fermer">✕</button>
    <button class="lightbox__nav lightbox__nav--prev" type="button" id="lightbox-prev" aria-label="Image précédente">‹</button>
    <img class="lightbox__img" id="lightbox-img" alt="">
    <button class="lightbox__nav lightbox__nav--next" type="button" id="lightbox-next" aria-label="Image suivante">›</button>
  </div>

  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__copy mono">
        &copy; <span id="footer-year"></span> BONSA Abdoul Rachid —
        <span data-i18n="footer_rights">Tous droits réservés.</span>
      </p>
      <div class="footer__links">
        <a href="https://github.com/RBonsa404" class="footer__link link-animated" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="index.html" class="footer__link link-animated" data-i18n="news_back_home">← Portfolio</a>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/actualites.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
